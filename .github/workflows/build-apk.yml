name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Java kur (Android için)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Web build al
        run: npm run build

      - name: Capacitor Android projesi oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: Uygulama ikonlarını yerleştir
        run: |
          python3 << 'PYEOF'
from PIL import Image
import os

def make_icon(size, out_path):
    img = Image.new('RGBA', (size, size), (2, 6, 23, 255))
    logo = Image.open('public/meccanen-logo.png').convert('RGBA')
    target_w = int(size * 0.80)
    ratio = target_w / logo.width
    target_h = int(logo.height * ratio)
    logo = logo.resize((target_w, target_h), Image.LANCZOS)
    x = (size - target_w) // 2
    y = (size - target_h) // 2
    img.paste(logo, (x, y), logo)
    img.save(out_path)
    print(f"✓ {out_path}")

base = 'android/app/src/main/res'
for d, s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
    os.makedirs(f'{base}/mipmap-{d}', exist_ok=True)
    make_icon(s, f'{base}/mipmap-{d}/ic_launcher.png')
    make_icon(s, f'{base}/mipmap-{d}/ic_launcher_round.png')
PYEOF

      - name: Debug APK build et
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Keystore oluştur (henüz secret yoksa)
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "Keystore secret eklenmemiş, sadece debug APK oluşturulacak"

      - name: Release AAB build et (Keystore varsa)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/meccanen.keystore
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/meccanen.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Debug APK'yı kaydet
        uses: actions/upload-artifact@v4
        with:
          name: meccanen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Release AAB'yi kaydet (varsa)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: meccanen-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
