name: Build Android APK & AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Bagımlılıkları yükle
        run: npm install
      - name: Web build al
        run: npm run build
      - name: Capacitor Android ekle
        run: |
          npx cap add android
          npx cap sync android
      - name: Android SDK 35'e güncelle (Play Store zorunluluğu)
        run: |
          cat > android/variables.gradle << 'GRADLEEOF'
          ext {
              minSdkVersion = 23
              compileSdkVersion = 35
              targetSdkVersion = 35
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          GRADLEEOF
          cat android/variables.gradle
      - name: Konum izinleri kontrolü (Capacitor otomatik merge eder)
        run: |
          echo "--- AndroidManifest.xml (Capacitor plugin merge sonrası) ---"
          cat android/app/src/main/AndroidManifest.xml
          echo "--- Geolocation plugin native dosyaları ---"
          find android -path "*geolocation*" -name "AndroidManifest.xml" -exec echo "Bulundu: {}" \; -exec cat {} \;
      - name: Version Code'u otomatik artır
        run: |
          # GitHub Actions çalışma numarasını versionCode olarak kullan — her seferinde benzersiz ve artan
          NEW_VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode .*/versionCode $NEW_VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"1.0.$NEW_VERSION_CODE\"/" android/app/build.gradle
          echo "Yeni versionCode: $NEW_VERSION_CODE"
          grep "versionCode\|versionName" android/app/build.gradle
      - name: Ikonları oluştur
        run: |
          pip install Pillow
          cat > /tmp/make_icons.py << 'PYEOF'
          from PIL import Image
          import os
          def make_icon(size, out_path):
              img = Image.new('RGBA', (size, size), (2, 6, 23, 255))
              logo = Image.open('public/meccanen-logo.png').convert('RGBA')
              target_w = int(size * 0.80)
              ratio = target_w / logo.width
              target_h = int(logo.height * ratio)
              logo = logo.resize((target_w, target_h), Image.LANCZOS)
              x = (size - target_w) // 2
              y = (size - target_h) // 2
              img.paste(logo, (x, y), logo)
              img.save(out_path)
              print(f"OK {out_path}")
          base = 'android/app/src/main/res'
          for d, s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              os.makedirs(f'{base}/mipmap-{d}', exist_ok=True)
              make_icon(s, f'{base}/mipmap-{d}/ic_launcher.png')
              make_icon(s, f'{base}/mipmap-{d}/ic_launcher_round.png')
          PYEOF
          python3 /tmp/make_icons.py
      - name: Debug APK build et
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Release AAB build et
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/meccanen.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/meccanen.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD
      - name: Debug APK kaydet
        uses: actions/upload-artifact@v4
        with:
          name: meccanen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Release AAB kaydet
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: meccanen-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
