name: Build Android APK & AAB
on:
  push:
    branches: [ main ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Android SDK kur
        uses: android-actions/setup-android@v3
      - name: Bagımlılıkları yükle
        run: npm install
      - name: "Local Notifications eklentisini yama: durum bildirimi zinciri (cancelPreviousId)"
        run: |
          cat > /tmp/patch_notif.py << 'PYEOF'
          import os

          path = "node_modules/@capacitor/local-notifications/android/src/main/java/com/capacitorjs/plugins/localnotifications/TimedNotificationPublisher.java"
          if not os.path.exists(path):
              raise SystemExit(f">>> HATA: {path} bulunamadı, @capacitor/local-notifications kurulu mu kontrol et.")

          with open(path) as f:
              content = f.read()

          marker = "        notificationManager.notify(id, notification);"
          if marker not in content:
              raise SystemExit(">>> HATA: Beklenen native kod satırı bulunamadı, eklenti sürümü değişmiş olabilir.")

          if "cancelPreviousId" in content:
              print(">>> Yama zaten uygulanmış, tekrar uygulanmadı.")
          else:
              patch = (
                  "        try {\n"
                  "            org.json.JSONObject extra = notificationJson.optJSONObject(\"extra\");\n"
                  "            if (extra != null && extra.has(\"cancelPreviousId\")) {\n"
                  "                notificationManager.cancel(extra.getInt(\"cancelPreviousId\"));\n"
                  "            }\n"
                  "        } catch (Exception e) {\n"
                  "            Logger.error(Logger.tags(\"LN\"), \"cancelPreviousId patch failed\", e);\n"
                  "        }\n"
                  + marker
              )
              content = content.replace(marker, patch)
              with open(path, "w") as f:
                  f.write(content)
              print(">>> Durum bildirimi zinciri yaması uygulandı.")
          PYEOF
          python3 /tmp/patch_notif.py
      - name: Web build al
        run: npm run build
      - name: Capacitor Android ekle
        run: |
          npx cap add android
          npx cap sync android
      - name: "BatteryHelper native plugin'ini oluştur ve MainActivity'ye kaydet (Xiaomi/MIUI bildirim fix'i)"
        run: |
          cat > /tmp/add_battery_plugin.py << 'PYEOF'
          import json, os, glob

          with open("capacitor.config.json") as f:
              cfg = json.load(f)
          app_id = cfg["appId"]
          pkg_path = app_id.replace(".", "/")
          java_dir = f"android/app/src/main/java/{pkg_path}"
          if not os.path.isdir(java_dir):
              raise SystemExit(f">>> HATA: {java_dir} bulunamadı, appId ({app_id}) doğru mu kontrol et.")

          plugin_path = f"{java_dir}/BatteryHelperPlugin.java"
          plugin_code = f'''package {app_id};

          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.PowerManager;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "BatteryHelper")
          public class BatteryHelperPlugin extends Plugin {{

              @PluginMethod
              public void requestIgnoreBatteryOptimizations(PluginCall call) {{
                  try {{
                      PowerManager pm = (PowerManager) getContext().getSystemService(Context.POWER_SERVICE);
                      String pkg = getContext().getPackageName();
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(pkg)) {{
                          Intent intent = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          intent.setData(Uri.parse("package:" + pkg));
                          intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(intent);
                      }}
                  }} catch (Exception e) {{
                      // sessizce geç
                  }}
                  call.resolve();
              }}

              @PluginMethod
              public void openXiaomiAutostartSettings(PluginCall call) {{
                  JSObject result = new JSObject();
                  try {{
                      Intent intent = new Intent();
                      intent.setComponent(new ComponentName(
                          "com.miui.securitycenter",
                          "com.miui.permcenter.autostart.AutoStartManagementActivity"
                      ));
                      intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      getContext().startActivity(intent);
                      result.put("opened", true);
                  }} catch (Exception e) {{
                      try {{
                          Intent fallback = new Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS);
                          fallback.setData(Uri.parse("package:" + getContext().getPackageName()));
                          fallback.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          getContext().startActivity(fallback);
                          result.put("opened", false);
                      }} catch (Exception e2) {{
                          result.put("opened", false);
                      }}
                  }}
                  call.resolve(result);
              }}
          }}
          '''
          with open(plugin_path, "w") as f:
              f.write(plugin_code)
          print(f">>> {plugin_path} oluşturuldu.")

          main_matches = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          if not main_matches:
              raise SystemExit(">>> HATA: MainActivity.java bulunamadı.")
          main_path = main_matches[0]
          with open(main_path) as f:
              content = f.read()

          minimal = "public class MainActivity extends BridgeActivity {}"
          if "registerPlugin(BatteryHelperPlugin.class)" in content:
              print(">>> BatteryHelperPlugin zaten kayıtlı, dokunulmadı.")
          elif minimal in content:
              patched = (
                  "public class MainActivity extends BridgeActivity {\n"
                  "    @Override\n"
                  "    public void onCreate(android.os.Bundle savedInstanceState) {\n"
                  "        registerPlugin(BatteryHelperPlugin.class);\n"
                  "        super.onCreate(savedInstanceState);\n"
                  "    }\n"
                  "}"
              )
              content = content.replace(minimal, patched)
              with open(main_path, "w") as f:
                  f.write(content)
              print(">>> BatteryHelperPlugin MainActivity'ye kaydedildi.")
          else:
              raise SystemExit(">>> HATA: MainActivity.java beklenen minimal formatta değil, elle kontrol et:\n" + content)
          PYEOF
          python3 /tmp/add_battery_plugin.py
      - name: Android SDK 35'e güncelle (Play Store zorunluluğu)
        run: |
          cat > android/variables.gradle << 'GRADLEEOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.8.0'
              androidxAppCompatVersion = '1.6.1'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.12.0'
              androidxFragmentVersion = '1.6.2'
              coreSplashScreenVersion = '1.0.1'
              androidxWebkitVersion = '1.9.0'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.1.5'
              androidxEspressoCoreVersion = '3.5.1'
              cordovaAndroidVersion = '10.1.1'
          }
          GRADLEEOF
          cat android/variables.gradle
      - name: Bildirim ses dosyalarını res/raw'a kopyala
        run: |
          mkdir -p android/app/src/main/res/raw
          cp assets/sounds/ezan_imsak.mp3 android/app/src/main/res/raw/ezan_imsak.mp3
          cp assets/sounds/ezan_ogle.mp3 android/app/src/main/res/raw/ezan_ogle.mp3
          cp assets/sounds/ezan_ikindi.mp3 android/app/src/main/res/raw/ezan_ikindi.mp3
          cp assets/sounds/ezan_aksam.mp3 android/app/src/main/res/raw/ezan_aksam.mp3
          cp assets/sounds/ezan_yatsi.mp3 android/app/src/main/res/raw/ezan_yatsi.mp3
          echo "--- res/raw içeriği ---"
          ls -la android/app/src/main/res/raw/
      - name: Bildirim küçük ikonunu (smallIcon) drawable'a kopyala
        run: |
          mkdir -p android/app/src/main/res/drawable-mdpi
          mkdir -p android/app/src/main/res/drawable-hdpi
          mkdir -p android/app/src/main/res/drawable-xhdpi
          mkdir -p android/app/src/main/res/drawable-xxhdpi
          mkdir -p android/app/src/main/res/drawable-xxxhdpi
          cp assets/notification_icon/ic_stat_notify_mdpi.png android/app/src/main/res/drawable-mdpi/ic_stat_notify.png
          cp assets/notification_icon/ic_stat_notify_hdpi.png android/app/src/main/res/drawable-hdpi/ic_stat_notify.png
          cp assets/notification_icon/ic_stat_notify_xhdpi.png android/app/src/main/res/drawable-xhdpi/ic_stat_notify.png
          cp assets/notification_icon/ic_stat_notify_xxhdpi.png android/app/src/main/res/drawable-xxhdpi/ic_stat_notify.png
          cp assets/notification_icon/ic_stat_notify_xxxhdpi.png android/app/src/main/res/drawable-xxxhdpi/ic_stat_notify.png
          echo "--- bildirim ikonu kopyalandı ---"
      - name: Konum izinlerini Manifest'e ekle
        run: |
          cat > /tmp/add_perms.py << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()

          if "ACCESS_COARSE_LOCATION" not in content:
              new_perms = (
                  '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
                  '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              )
              # </manifest> kapanışından hemen önce, mevcut <uses-permission> bloğunun yanına ekle
              marker = '<uses-permission android:name="android.permission.INTERNET" />'
              if marker in content:
                  content = content.replace(marker, marker + "\n" + new_perms.rstrip())
              else:
                  content = content.replace("</manifest>", new_perms + "</manifest>")
              with open(path, "w") as f:
                  f.write(content)
              print(">>> Konum izinleri eklendi.")
          else:
              print(">>> Konum izinleri zaten mevcut, dokunulmadı.")

          # KRİTİK: Geolocation plugin'in manifest merger'ı, GPS donanım özelliğini
          # otomatik olarak ZORUNLU (required=true) ekliyor. Bu da GPS çipi olmayan / sadece
          # ağ tabanlı konum kullanan cihazları (Play Console'un "X cihaz artık desteklenmiyor"
          # uyarısına sebep olan cihazlar) Play Store'da listeden düşürüyor.
          # required="false" ile açıkça override ederek bu cihazların desteğini geri kazanıyoruz.
          feature_overrides = (
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.location.network" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.location" android:required="false" />\n'
          )
          if 'android.hardware.location.gps" android:required="false"' not in content:
              content = content.replace("</manifest>", feature_overrides + "</manifest>")
              with open(path, "w") as f:
                  f.write(content)
              print(">>> GPS donanım özelliği 'required=false' olarak override edildi.")
          else:
              print(">>> GPS donanım özelliği zaten override edilmiş, dokunulmadı.")

          # KRİTİK: Namaz vakti bildirimleri belirli bir dakikada tetiklenmesi gereken
          # ZAMANLI (kesin/exact) alarmlardır. Android 12+ (API 31+) bu izin manifestte
          # olmadan "kesin olmayan" (inexact) bir alarma düşüyor — bildirim dakikalarca/
          # saatlerce gecikebiliyor ya da pil optimizasyonu yüzünden hiç gelmiyor.
          # SCHEDULE_EXACT_ALARM: API 31-32'de otomatik verilir. USE_EXACT_ALARM: API 33+'te
          # kullanıcıya sormadan otomatik verilir (namaz vakti gibi zaman-kritik uygulamalar
          # için Google'ın öngördüğü meşru kullanım alanı). İkisini birlikte ekleyerek
          # minSdk 24'ten targetSdk 36'ya kadar tüm sürümlerde kesin alarm çalışmasını sağlıyoruz.
          alarm_perms = (
              '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n'
              '    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n'
          )
          if "SCHEDULE_EXACT_ALARM" not in content:
              content = content.replace("</manifest>", alarm_perms + "</manifest>")
              with open(path, "w") as f:
                  f.write(content)
              print(">>> Kesin alarm izinleri eklendi.")
          else:
              print(">>> Kesin alarm izinleri zaten mevcut, dokunulmadı.")
          PYEOF
          python3 /tmp/add_perms.py
          echo "--- AndroidManifest.xml (izin eklendikten sonra) ---"
          cat android/app/src/main/AndroidManifest.xml
      - name: Version Code'u otomatik artır
        run: |
          # GitHub Actions çalışma numarasını versionCode olarak kullan — her seferinde benzersiz ve artan
          NEW_VERSION_CODE=${{ github.run_number }}
          sed -i "s/versionCode .*/versionCode $NEW_VERSION_CODE/" android/app/build.gradle
          sed -i "s/versionName .*/versionName \"1.0.$NEW_VERSION_CODE\"/" android/app/build.gradle
          echo "Yeni versionCode: $NEW_VERSION_CODE"
          grep "versionCode\|versionName" android/app/build.gradle
      - name: Ikonları oluştur
        run: |
          pip install Pillow
          cat > /tmp/make_icons.py << 'PYEOF'
          from PIL import Image
          import os

          if not os.path.exists('public/meccanen-logo.png'):
              raise SystemExit(
                  ">>> HATA: public/meccanen-logo.png bulunamadı. "
                  "Logo dosyasının GitHub'a repo kökündeki public/ klasörüne "
                  "yüklendiğinden emin ol (dosya adı ve yol birebir aynı olmalı)."
              )

          def make_icon(size, out_path, margin_ratio=0.80):
              img = Image.new('RGBA', (size, size), (2, 6, 23, 255))
              logo = Image.open('public/meccanen-logo.png').convert('RGBA')
              target_w = int(size * margin_ratio)
              ratio = target_w / logo.width
              target_h = int(logo.height * ratio)
              logo = logo.resize((target_w, target_h), Image.LANCZOS)
              x = (size - target_w) // 2
              y = (size - target_h) // 2
              img.paste(logo, (x, y), logo)
              img.save(out_path)
              print(f"OK {out_path}")

          def make_foreground(size, out_path, margin_ratio=0.54):
              # Adaptive icon foreground: şeffaf zemin (arka plan rengi ayrı katmandan gelir).
              # Farklı launcher maske şekillerinde (daire, kare, damla) kenardan kırpılmaması
              # için içerik güvenli bölgeye (~%60) sığdırılıyor — düz ikondaki %80'den daha dar.
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              logo = Image.open('public/meccanen-logo.png').convert('RGBA')
              target_w = int(size * margin_ratio)
              ratio = target_w / logo.width
              target_h = int(logo.height * ratio)
              logo = logo.resize((target_w, target_h), Image.LANCZOS)
              x = (size - target_w) // 2
              y = (size - target_h) // 2
              img.paste(logo, (x, y), logo)
              img.save(out_path)
              print(f"OK {out_path}")

          base = 'android/app/src/main/res'
          # Eski (API < 26) düz ikonlar — bu cihazlarda doğrudan görünür
          for d, s in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              os.makedirs(f'{base}/mipmap-{d}', exist_ok=True)
              make_icon(s, f'{base}/mipmap-{d}/ic_launcher.png')
              make_icon(s, f'{base}/mipmap-{d}/ic_launcher_round.png')

          # KRİTİK: Android 8+ (API 26+) — sistem düz ic_launcher.png'yi YOK SAYIP
          # mipmap-anydpi-v26/ic_launcher.xml üzerinden bu foreground katmanını kullanır.
          # Güncellenmezse Capacitor'ın varsayılan örnek ikonu (spark logosu) görünmeye devam eder.
          for d, s in [('mdpi',108),('hdpi',162),('xhdpi',216),('xxhdpi',324),('xxxhdpi',432)]:
              os.makedirs(f'{base}/mipmap-{d}', exist_ok=True)
              make_foreground(s, f'{base}/mipmap-{d}/ic_launcher_foreground.png')

          # Adaptive icon arka plan rengini (varsayılan beyaz) navy yap
          bg_color_path = f'{base}/values/ic_launcher_background.xml'
          if os.path.exists(bg_color_path):
              with open(bg_color_path) as f:
                  content = f.read()
              content = content.replace('#FFFFFF', '#020617').replace('#ffffff', '#020617')
              with open(bg_color_path, 'w') as f:
                  f.write(content)
              print(">>> ic_launcher_background rengi navy yapıldı.")
          else:
              print(">>> UYARI: ic_launcher_background.xml bulunamadı, arka plan rengi güncellenemedi.")
          PYEOF
          python3 /tmp/make_icons.py
      - name: Debug APK build et
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Release AAB build et
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/meccanen.keystore
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/meccanen.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD
      - name: Debug APK kaydet
        uses: actions/upload-artifact@v4
        with:
          name: meccanen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Release AAB kaydet
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: meccanen-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
